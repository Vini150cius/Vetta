name: financas_app
description: App de gestão financeira offline-first com SQLite criptografado e biometria.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # a versão é fixada por flutter_localizations
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite_sqlcipher: ^3.1.0
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  csv: ^6.0.0
  excel: ^4.0.3
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_vetta.png
